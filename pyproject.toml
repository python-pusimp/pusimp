[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pusimp"
version = "0.1.dev2"
authors = [
    {name = "Francesco Ballarin", email = "francesco.ballarin@unicatt.it"},
    {name = "Drew Parsons", email = "dparsons@debian.org"},
]
maintainers = [
    {name = "Francesco Ballarin", email = "francesco.ballarin@unicatt.it"},
    {name = "Drew Parsons", email = "dparsons@debian.org"},
]
description = "Prevent user-site imports"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
repository = "https://github.com/python-pusimp/pusimp"
issues = "https://github.com/python-pusimp/pusimp/issues"

[project.optional-dependencies]
lint = [
    "prek",
    "ruff",
    "ty",
    "yamllint"
]
tests = [
    "coverage[toml]",
    "pip",
    "pytest",
    "virtualenv"
]

[tool.pytest.ini_options]

[tool.ruff]
line-length = 80

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "ANN", "ARG", "B", "C4", "D", "E", "F", "FLY", "I", "ICN", "N", "PTH", "Q",
    "RUF", "T20", "TC", "UP", "W"
]
ignore = []

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools.package-data]
pusimp = ["py.typed"]

[tool.setuptools.packages.find]
namespaces = false

[tool.ty.analysis]
allowed-unresolved-imports = [
    "pusimp_dependency_missing",
    "tomllib",
    "virtualenv.**",
]

[tool.ty.environment]
extra-paths = [
    "tests/data/pusimp_dependency_one",
    "tests/data/pusimp_dependency_two",
    "tests/data/pusimp_dependency_three",
    "tests/data/pusimp_dependency_four",
    "tests/data/pusimp_dependency_five",
    "tests/data/pusimp_dependency_six",
    "tests/data/pusimp_golden_source",
    "tests/data/pusimp_package_one",
    "tests/data/pusimp_package_two",
    "tests/data/pusimp_package_three",
    "tests/data/pusimp_package_four",
    "tests/data/pusimp_package_five",
    "tests/data/pusimp_package_six",
    "tests/data/pusimp_package_seven",
    "tests/data/pusimp_package_eight",
    "tests/data/pusimp_package_nine",
    "tests/data/pusimp_package_ten",
    "tests/data/pusimp_package_eleven",
]
